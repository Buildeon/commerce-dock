name: commerce-dock

services:
  commerce-dock:
    build: .
    image: ghcr.io/buildeon/commerce-dock:latest
    container_name: commerce-dock
    restart: unless-stopped
    ports:
      - "8089:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.commerce-dock.rule=Host(`tools.buildeon.agency`)"
      - "traefik.http.routers.commerce-dock.entrypoints=websecure"
      - "traefik.http.routers.commerce-dock.tls=true"
      - "traefik.http.routers.commerce-dock.tls.certresolver=le"
      - "traefik.http.routers.commerce-dock.middlewares=local-only@file"
      - "traefik.http.services.commerce-dock.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
